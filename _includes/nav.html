<nav class="site-nav" aria-label="Documentation">
  {% for section in site.data.nav %}
    <section class="nav-section">
      <h2 class="nav-heading">{{ section.title }}</h2>
      <ul class="nav-list">
        {% for item in section.items %}
          <li>
            {% if item.external %}
              <a href="{{ item.url }}" class="nav-link" rel="noopener noreferrer" target="_blank">{{ item.title }}</a>
            {% else %}
              <a href="{{ item.url | relative_url }}" class="nav-link{% if page.url == item.url %} is-active{% endif %}">{{ item.title }}</a>
            {% endif %}
          </li>
        {% endfor %}
      </ul>
    </section>
  {% endfor %}
</nav>
